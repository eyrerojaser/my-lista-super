# Configuración para Netlify. No hay que compilar nada: se publica la carpeta tal cual.
[build]
  publish = "."

# Funciones del servidor para los avisos de Freezer Scan
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Manual de uso: el lector de PDF (pdf.js) son módulos .mjs y deben servirse como JavaScript.
[[headers]]
  for = "/vendor/pdfjs/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/manual/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
